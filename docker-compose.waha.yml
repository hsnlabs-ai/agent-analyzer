services:
  waha:
    image: devlikeapro/waha:latest
    container_name: agent-analyzer-waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WHATSAPP_RESTART_ALL_SESSIONS=True
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  waha_sessions:
